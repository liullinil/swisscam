<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SwissCAM — редактор и симулятор УП продольного точения</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23f0a020' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f0a020'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Swiss<span>CAM</span></div>
      <label class="field">
        Стойка
        <select id="dialect"></select>
      </label>
      <label class="field">
        Пруток ⌀
        <input id="barDia" type="number" step="0.5" min="1" max="80" value="20" />
      </label>
      <label class="field">
        Длина участка
        <input id="barLen" type="number" step="5" min="5" max="400" value="60" />
      </label>
      <label class="field">
        Плоскость отрезки Z
        <input id="cutPlane" type="number" step="1" value="-20" />
      </label>
      <div class="spacer"></div>
      <button id="openBtn" class="btn">Открыть…</button>
      <button id="saveBtn" class="btn">Сохранить</button>
      <input id="fileInput" type="file" accept=".nc,.txt,.cnc,.gcode,.mpf,.prg" hidden />
    </header>

    <main class="layout">
      <section class="pane editor-pane">
        <div class="pane-head">
          <span id="fileName">без имени.nc</span>
          <span id="channelInfo" class="muted"></span>
        </div>
        <div id="editor" class="editor"></div>
      </section>

      <section class="pane view-pane">
        <div class="pane-head">
          <span>Заготовка и траектории</span>
          <span class="spacer"></span>
          <label class="chk"><input type="checkbox" id="showRapid" /> холостые</label>
          <label class="chk"><input type="checkbox" id="showPaths" checked /> траектории</label>
          <button id="fitBtn" class="btn small">Вписать</button>
        </div>
        <canvas id="plot" class="plot"></canvas>
        <div class="transport">
          <button id="playBtn" class="btn">▶</button>
          <button id="stepBtn" class="btn" title="Следующий кадр">⏭</button>
          <button id="resetBtn" class="btn" title="В начало">⏮</button>
          <input id="scrub" type="range" min="0" max="1000" value="0" />
          <select id="speed">
            <option value="1">×1</option>
            <option value="5" selected>×5</option>
            <option value="20">×20</option>
            <option value="100">×100</option>
          </select>
          <span id="clock" class="clock">0.00 с</span>
        </div>
        <canvas id="gantt" class="gantt"></canvas>
      </section>
    </main>

    <footer class="statusbar">
      <div id="stats" class="stats"></div>
      <div id="diags" class="diags"></div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
